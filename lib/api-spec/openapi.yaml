openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: link-check
    description: Cautious URL text assessment
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /link-check:
    post:
      operationId: assessLink
      tags: [link-check]
      summary: Assess a URL without opening it
      description: Checks URL structure and optional message wording only; does not visit the URL or query threat-intelligence services.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkCheckInput"
      responses:
        "200":
          description: Assessment complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkCheckResult"
        "400":
          description: The URL could not be assessed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LinkCheckInput:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
        message:
          type: string
          maxLength: 2000
      required:
        - url
    LinkCheckResult:
      type: object
      properties:
        assessment:
          type: string
          enum: [suspicious, insufficient]
        host:
          type: string
        reasonCodes:
          type: array
          items:
            type: string
            enum:
              - embedded_credentials
              - punycode_host
              - ip_address_host
              - url_shortener
              - pressure_words
              - password_request
              - reserved_example_domain
              - no_clear_red_flags
        nextStepCode:
          type: string
          enum: [do_not_open, verify_separately, ask_sender]
        disclaimerCode:
          type: string
          enum: [text_only]
      required:
        - assessment
        - host
        - reasonCodes
        - nextStepCode
        - disclaimerCode
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

