openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: link-check
    description: Safe text-only link assessment
paths:
  /whatsapp:
    post:
      operationId: receiveWhatsapp
      tags: [link-check]
      summary: Receive a signed Twilio WhatsApp Sandbox message
      description: Validates the signature against the configured public HTTPS webhook URL and all form fields. Unique MessageSid values are durably recorded. Valid links are acknowledged immediately and analyzed asynchronously.
      parameters:
        - in: header
          name: X-Twilio-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WhatsappMessage"
      responses:
        "200":
          description: TwiML reply or empty TwiML for a duplicate
          content:
            text/xml:
              schema: { type: string }
        "400":
          description: Invalid form fields
        "403":
          description: Invalid signature or account
        "415":
          description: Form-encoded body required
        "503":
          description: Integration not configured or durable queue unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /check:
    post:
      operationId: checkLink
      tags: [link-check]
      summary: Check a URL without opening it
      description: Validates URL text, compares its parsed hostname exactly with the listed organisation named in the message, and analyzes provided message text with Replit-managed OpenAI. AI findings are structured and validated; the submitted URL is never visited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkCheckInput"
      responses:
        "200":
          description: Assessment complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkCheckResult"
        "400":
          description: Invalid URL, language, or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Request body exceeds the configured limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Request limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Analysis service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    WhatsappMessage:
      type: object
      additionalProperties: true
      required: [MessageSid, AccountSid, From, To, Body]
      properties:
        MessageSid: { type: string, pattern: "^SM[0-9a-fA-F]{32}$" }
        AccountSid: { type: string, pattern: "^AC[0-9a-fA-F]{32}$" }
        From: { type: string, pattern: "^whatsapp:\\+[1-9][0-9]{6,14}$" }
        To: { type: string, pattern: "^whatsapp:\\+[1-9][0-9]{6,14}$" }
        Body: { type: string, maxLength: 2000 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LinkCheckInput:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
        message:
          type: string
          maxLength: 2000
        language:
          type: string
          enum: [ar, en]
      required: [url, language]
    LinkCheckResult:
      type: object
      properties:
        assessment:
          type: string
          enum: [suspicious, official_domain_match, unverified]
        language:
          type: string
          enum: [ar, en]
        host:
          type: string
        registrableDomain:
          type: ["string", "null"]
        directoryCheck:
          $ref: "#/components/schemas/DirectoryCheck"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/LinkCheckEvidence"
        nextStep:
          $ref: "#/components/schemas/LinkCheckNextStep"
        aiAnalysis:
          $ref: "#/components/schemas/AiMessageAnalysis"
        disclaimerCode:
          type: string
          enum: [text_only, domain_match_is_not_safety]
      required: [assessment, language, host, registrableDomain, directoryCheck, evidence, nextStep, aiAnalysis, disclaimerCode]
    DirectoryCheck:
      description: Exact hostname comparison for the single listed organisation identified in the message, if any.
      type: object
      properties:
        code:
          type: string
          enum: [exact_match, hostname_not_listed, insufficient_information]
        message:
          type: string
          description: Localized result text for the hostname comparison.
        organisation:
          oneOf:
            - $ref: "#/components/schemas/DirectoryOrganisation"
            - type: "null"
      required: [code, message, organisation]
    DirectoryOrganisation:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        hostname:
          type: string
        sourceUrl:
          type: string
          format: uri
        verificationDate:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: Verification date in YYYY-MM-DD format
      required: [name, category, hostname, sourceUrl, verificationDate]
    LinkCheckEvidence:
      type: object
      properties:
        code:
          type: string
          enum:
            - embedded_credentials
            - punycode_host
            - ip_address_host
            - url_shortener
            - insecure_http
            - pressure_words
            - password_request
            - official_domain_match
            - organisation_hostname_mismatch
            - organisation_unidentified
            - reserved_example_domain
            - no_clear_indicators
        detail:
          type: string
      required: [code, detail]
    LinkCheckNextStep:
      type: object
      properties:
        code:
          type: string
          enum: [do_not_open, verify_official_channel, contact_sender]
        instruction:
          type: string
      required: [code, instruction]
    AiMessageAnalysis:
      type: object
      properties:
        status:
          type: string
          enum: [analyzed, inconclusive, unavailable, not_requested]
        claimedOrganisation:
          type: ["string", "null"]
        signals:
          type: array
          items:
            $ref: "#/components/schemas/AiMessageSignal"
        message:
          type: string
      required: [status, claimedOrganisation, signals, message]
    AiMessageSignal:
      type: object
      properties:
        kind:
          type: string
          enum: [payment_request, urgency, sensitive_information]
        excerpt:
          type: string
        explanation:
          type: string
      required: [kind, excerpt, explanation]
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]

